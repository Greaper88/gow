name: Publish Jellyfin Media Player

on:
  push:
    branches: [master, plasma-container]
    paths:
      - apps/jellyfin/**
      - bin/test-image.sh
      - bin/tests/**
      - .github/workflows/publish-jellyfin.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-jellyfin
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Greaper88/gow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: Read player version
        id: version
        run: |
          version=$(sed -n 's/^ARG JELLYFIN_VERSION=//p' apps/jellyfin/build/Dockerfile)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/greaper88/jellyfin
          tags: |
            type=raw,value=edge
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: apps/jellyfin/build
          platforms: linux/amd64
          load: true
          tags: gow/jellyfin:test
          labels: ${{ steps.meta.outputs.labels }}
          build-args: IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=jellyfin
          cache-to: type=gha,mode=max,scope=jellyfin

      - name: Test image
        run: bin/test-image.sh jellyfin gow/jellyfin:test --docker-path apps

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish tested image
        uses: docker/build-push-action@v6
        with:
          context: apps/jellyfin/build
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: IMAGE_SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=jellyfin
