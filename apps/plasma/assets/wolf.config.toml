[[apps]]
title = 'Desktop (Plasma)'

[apps.runner]
type = 'docker'
name = 'WolfPlasma'
image = 'gow/plasma:local'
env = ['GOW_REQUIRED_DEVICES=/dev/input/* /dev/dri/* /dev/nvidia* /dev/fuse']
devices = ['/dev/fuse:/dev/fuse']
mounts = []
ports = []
base_create_json = '''
{
  "HostConfig": {
    "Privileged": false,
    "CapAdd": ["SYS_ADMIN", "DAC_READ_SEARCH"],
    "SecurityOpt": ["seccomp=unconfined", "apparmor=unconfined"],
    "MaskedPaths": [],
    "ReadonlyPaths": [],
    "DeviceCgroupRules": ["c 13:* rmw", "c 244:* rmw"]
  }
}
'''
